name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Fetch DPF
        run: git clone --depth 1 --recursive https://github.com/DISTRHO/DPF.git dpf
      - name: Build universal (arm64 + x86_64)
        env:
          CFLAGS: -arch x86_64 -arch arm64 -mmacosx-version-min=10.13
          CXXFLAGS: -arch x86_64 -arch arm64 -mmacosx-version-min=10.13
          LDFLAGS: -arch x86_64 -arch arm64 -mmacosx-version-min=10.13
        run: make -C plugins/Gneiss -j3
      - name: Ad-hoc sign bundles
        run: |
          for b in bin/*.vst3 bin/*.component bin/*.vst bin/*.clap; do
            [ -e "$b" ] && codesign --force --deep --sign - "$b"
          done
          lipo -info bin/Gneiss.vst3/Contents/MacOS/Gneiss
      - name: Package
        run: |
          mkdir -p dist/macos-universal
          cp -R bin/*.vst3 bin/*.component bin/*.clap dist/macos-universal/ 2>/dev/null || true
          [ -e bin/Gneiss.vst ] && cp -R bin/Gneiss.vst dist/macos-universal/
          cp docs/Gneiss-Manual.html dist/macos-universal/
          cd dist && ditto -c -k --keepParent macos-universal Gneiss-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Gneiss-macos-universal
          path: dist/macos-universal
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/Gneiss-macos-universal.zip

  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - run: git clone --depth 1 --recursive https://github.com/DISTRHO/DPF.git dpf
      - run: make -C plugins/Gneiss -j3 WINDOWS=true CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++
      - run: |
          mkdir -p dist/windows-x64 && cp -R bin/Gneiss.vst3 bin/Gneiss.clap bin/Gneiss-vst.dll docs/Gneiss-Manual.html dist/windows-x64/
          cd dist && zip -r Gneiss-windows-x64.zip windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: Gneiss-windows-x64
          path: dist/windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/Gneiss-windows-x64.zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libdbus-1-dev
      - run: git clone --depth 1 --recursive https://github.com/DISTRHO/DPF.git dpf
      - run: make -C plugins/Gneiss -j3
      - run: |
          mkdir -p dist/linux-x64 && cp -R bin/Gneiss.vst3 bin/Gneiss.clap bin/Gneiss-vst.so docs/Gneiss-Manual.html dist/linux-x64/
          cd dist && zip -r Gneiss-linux-x64.zip linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: Gneiss-linux-x64
          path: dist/linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/Gneiss-linux-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
